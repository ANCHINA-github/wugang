<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>功能触发通知演示</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入通知核心模块 -->
    <script src="notification-core.js"></script>
    <style>
        .func-card { border: 1px solid #e5e7eb; border-radius: 8px; padding: 1.5rem; margin-bottom: 1rem; }
        .status-text { margin-top: 0.5rem; font-size: 0.875rem; }
    </style>
</head>
<body class="bg-gray-100 font-sans max-w-3xl mx-auto p-4 md:p-8">
    <h1 class="text-3xl font-bold text-gray-800 mb-6">功能触发通知演示</h1>

    <!-- 1. 通知权限申请区域 -->
    <div class="func-card">
        <h2 class="text-xl font-semibold mb-3">基础操作：申请通知权限</h2>
        <button id="requestPermBtn" class="bg-amber-600 hover:bg-amber-700 text-white py-2 px-4 rounded-md">申请通知权限</button>
        <div id="permStatus" class="status-text text-gray-600 mt-2">权限状态：未检测</div>
    </div>

    <!-- 2. 文件上传功能 -->
    <div class="func-card">
        <h2 class="text-xl font-semibold mb-3">功能1：文件上传</h2>
        <input type="file" id="fileUpload" class="block mb-2">
        <div id="uploadStatus" class="status-text text-gray-600">未选择文件</div>
    </div>

    <!-- 3. 文本复制功能 -->
    <div class="func-card">
        <h2 class="text-xl font-semibold mb-3">功能2：文本复制</h2>
        <input type="text" id="copyInput" placeholder="输入要复制的文本" class="border rounded-md py-2 px-3 w-full mb-2">
        <button id="copyBtn" class="bg-green-600 hover:bg-green-700 text-white py-2 px-4 rounded-md">复制文本</button>
        <div id="copyStatus" class="status-text text-gray-600">未复制</div>
    </div>

    <!-- 4. 清空输入功能 -->
    <div class="func-card">
        <h2 class="text-xl font-semibold mb-3">功能3：清空输入</h2>
        <input type="text" id="clearInput" placeholder="输入任意文本后可清空" class="border rounded-md py-2 px-3 w-full mb-2">
        <button id="clearBtn" class="bg-red-600 hover:bg-red-700 text-white py-2 px-4 rounded-md">清空输入</button>
        <div id="clearStatus" class="status-text text-gray-600">未清空</div>
    </div>

    <!-- 5. 获取当前时间功能 -->
    <div class="func-card">
        <h2 class="text-xl font-semibold mb-3">功能4：获取当前时间</h2>
        <button id="getTimeBtn" class="bg-blue-600 hover:bg-blue-700 text-white py-2 px-4 rounded-md">获取当前时间</button>
        <div id="timeStatus" class="status-text text-gray-600">未获取</div>
    </div>

    <!-- 6. 数字计算功能 -->
    <div class="func-card">
        <h2 class="text-xl font-semibold mb-3">功能5：两数相加</h2>
        <div class="flex gap-2 mb-2">
            <input type="number" id="num1" placeholder="数字1" class="border rounded-md py-2 px-3 flex-1">
            <span class="flex items-center">+</span>
            <input type="number" id="num2" placeholder="数字2" class="border rounded-md py-2 px-3 flex-1">
        </div>
        <button id="calcBtn" class="bg-purple-600 hover:bg-purple-700 text-white py-2 px-4 rounded-md">计算结果</button>
        <div id="calcStatus" class="status-text text-gray-600">未计算</div>
    </div>

    <script>
        // 页面加载后初始化
        document.addEventListener('DOMContentLoaded', () => {
            // ========== 1. 初始化权限状态 ==========
            const permBtn = document.getElementById('requestPermBtn');
            const permStatus = document.getElementById('permStatus');
            // 初始显示权限状态
            permStatus.textContent = `权限状态：${notificationCore.getPermissionStatus()}`;
            
            // 申请权限按钮点击事件
            permBtn.addEventListener('click', async () => {
                try {
                    const result = await notificationCore.requestPermission();
                    permStatus.textContent = `权限状态：${result}`;
                    permStatus.className = 'status-text text-green-600';
                    // 权限申请成功后发送通知（通知内容紧跟代码后）
                    await notificationCore.sendNotification('权限申请成功', {
                        body: '你已授予网页发送通知的权限，后续触发功能时会收到对应通知',
                        autoClose: 6000
                    });
                } catch (err) {
                    permStatus.textContent = `权限状态：${err}`;
                    permStatus.className = 'status-text text-red-600';
                }
            });

            // ========== 2. 文件上传功能 ==========
            const fileUpload = document.getElementById('fileUpload');
            const uploadStatus = document.getElementById('uploadStatus');
            
            fileUpload.addEventListener('change', async (e) => {
                const files = e.target.files;
                if (files.length === 0) {
                    uploadStatus.textContent = '未选择文件';
                    return;
                }
                const fileName = files[0].name;
                uploadStatus.textContent = `已选择文件：${fileName}`;
                uploadStatus.className = 'status-text text-blue-600';
                
                // 触发上传选择后发送通知（通知内容紧跟代码后）
                try {
                    await notificationCore.sendNotification('文件上传操作', {
                        body: `你正在使用文件上传功能，已选择文件：${fileName}`,
                        autoClose: 5000
                    });
                } catch (err) {
                    uploadStatus.textContent += `（通知发送失败：${err}）`;
                    uploadStatus.className = 'status-text text-orange-600';
                }
            });

            // ========== 3. 文本复制功能 ==========
            const copyInput = document.getElementById('copyInput');
            const copyBtn = document.getElementById('copyBtn');
            const copyStatus = document.getElementById('copyStatus');
            
            copyBtn.addEventListener('click', async () => {
                const text = copyInput.value.trim();
                if (text === '') {
                    copyStatus.textContent = '复制失败：输入框为空';
                    copyStatus.className = 'status-text text-red-600';
                    return;
                }
                
                try {
                    // 执行复制操作
                    await navigator.clipboard.writeText(text);
                    copyStatus.textContent = `复制成功：${text}`;
                    copyStatus.className = 'status-text text-green-600';
                    
                    // 复制成功后发送通知（通知内容紧跟代码后）
                    await notificationCore.sendNotification('文本复制操作', {
                        body: `你已复制文本：${text}`,
                        autoClose: 5000
                    });
                } catch (err) {
                    copyStatus.textContent = `复制失败：${err.message}`;
                    copyStatus.className = 'status-text text-red-600';
                }
            });

            // ========== 4. 清空输入功能 ==========
            const clearInput = document.getElementById('clearInput');
            const clearBtn = document.getElementById('clearBtn');
            const clearStatus = document.getElementById('clearStatus');
            
            clearBtn.addEventListener('click', async () => {
                const originalText = clearInput.value.trim();
                if (originalText === '') {
                    clearStatus.textContent = '清空失败：输入框已为空';
                    clearStatus.className = 'status-text text-red-600';
                    return;
                }
                
                // 执行清空操作
                clearInput.value = '';
                clearStatus.textContent = `清空成功：已清空文本“${originalText}”`;
                clearStatus.className = 'status-text text-green-600';
                
                // 清空后发送通知（通知内容紧跟代码后）
                try {
                    await notificationCore.sendNotification('输入框清空操作', {
                        body: `你正在使用清空输入功能，已清空文本：${originalText}`,
                        autoClose: 5000
                    });
                } catch (err) {
                    clearStatus.textContent += `（通知发送失败：${err}）`;
                    clearStatus.className = 'status-text text-orange-600';
                }
            });

            // ========== 5. 获取当前时间功能 ==========
            const getTimeBtn = document.getElementById('getTimeBtn');
            const timeStatus = document.getElementById('timeStatus');
            
            getTimeBtn.addEventListener('click', async () => {
                // 获取当前时间
                const now = new Date();
                const timeStr = now.toLocaleString('zh-CN');
                timeStatus.textContent = `当前时间：${timeStr}`;
                timeStatus.className = 'status-text text-blue-600';
                
                // 获取时间后发送通知（通知内容紧跟代码后）
                try {
                    await notificationCore.sendNotification('获取当前时间', {
                        body: `你触发了获取时间功能，当前系统时间：${timeStr}`,
                        autoClose: 5000
                    });
                } catch (err) {
                    timeStatus.textContent += `（通知发送失败：${err}）`;
                    timeStatus.className = 'status-text text-orange-600';
                }
            });

            // ========== 6. 数字计算功能 ==========
            const num1 = document.getElementById('num1');
            const num2 = document.getElementById('num2');
            const calcBtn = document.getElementById('calcBtn');
            const calcStatus = document.getElementById('calcStatus');
            
            calcBtn.addEventListener('click', async () => {
                const n1 = Number(num1.value);
                const n2 = Number(num2.value);
                
                if (isNaN(n1) || isNaN(n2)) {
                    calcStatus.textContent = '计算失败：请输入有效的数字';
                    calcStatus.className = 'status-text text-red-600';
                    return;
                }
                
                // 执行加法计算
                const result = n1 + n2;
                calcStatus.textContent = `计算结果：${n1} + ${n2} = ${result}`;
                calcStatus.className = 'status-text text-purple-600';
                
                // 计算完成后发送通知（通知内容紧跟代码后）
                try {
                    await notificationCore.sendNotification('数字加法计算', {
                        body: `你触发了加法计算功能，${n1} + ${n2} = ${result}`,
                        autoClose: 5000
                    });
                } catch (err) {
                    calcStatus.textContent += `（通知发送失败：${err}）`;
                    calcStatus.className = 'status-text text-orange-600';
                }
            });
        });
    </script>
</body>
</html>
