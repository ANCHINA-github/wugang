    <!-- ========== ① 引导页跳转：优先执行，早于一切渲染 ========== -->
    <script>
    (function () {
        var KEY   = 'wxq_guide_last_time';          // 上次展示引导页的时间戳
        var CYCLE = 30 * 24 * 60 * 60 * 1000;       // 30 天

        var store = null;
        try {
            localStorage.setItem('__wxq_probe__', '1');
            localStorage.removeItem('__wxq_probe__');
            store = localStorage;
        } catch (e) {
            store = null;
        }
        if (!store) return;

        var jumpedThisSession = false;
        try {
            jumpedThisSession = sessionStorage.getItem('__wxq_guide_jump__') === '1';
        } catch (e) {}

        var last = 0;
        try {
            last = parseInt(store.getItem(KEY), 10) || 0;
        } catch (e) {
            last = 0;
        }

        if (!jumpedThisSession && (!last || (Date.now() - last) >= CYCLE)) {
            try {
                store.setItem(KEY, String(Date.now()));
                sessionStorage.setItem('__wxq_guide_jump__', '1');
            } catch (e) {}
            window.location.href = 'guide.html';
        }
    })();
    </script>

<script>
(function () {
    'use strict';

    var splash      = document.getElementById('splash-screen');
    var targetPage  = document.getElementById('target-page');
    var bgLoader    = document.getElementById('bg-loader');
    var bottomBar   = document.getElementById('bottomBar');
    var hideBtn     = document.getElementById('toggleHideBtn');
    var restoreBtn  = document.getElementById('navRestoreBtn');
    var capsule     = document.getElementById('capsuleContainer');
    var sliderBg    = document.getElementById('sliderBg');
    var searchCircle= document.getElementById('searchCircle');
    var tabItems    = Array.prototype.slice.call(document.querySelectorAll('.tab-item'));

    var MIN_SPLASH_TIME = 800;
    var NAV_PAD_SHOWN   = '85pt';
    var NAV_PAD_HIDDEN  = '20pt';

    var startTime        = Date.now();
    var firstLoadDone    = false;
    var bottomBarReady   = false;
    var iframeBodyStyle  = null;
    var loaderTimer      = null;
    var currentUrl       = 'core.php';

    function showLoader(delay) {
        if (!bgLoader) return;
        clearTimeout(loaderTimer);
        loaderTimer = setTimeout(function () {
            bgLoader.classList.add('show');
        }, typeof delay === 'number' ? delay : 180);
    }
    function hideLoader() {
        clearTimeout(loaderTimer);
        if (bgLoader) bgLoader.classList.remove('show');
    }

    window.switchFramePage = function (url) {
        if (!targetPage || !url) return;
        if (url === currentUrl && targetPage.getAttribute('src')) {
            return;
        }
        currentUrl = url;
        targetPage.classList.remove('is-ready');
        showLoader(200);
        targetPage.src = url + '?v=' + Date.now();
    };

    function applyIframePadding(hidden) {
        if (!iframeBodyStyle) return;
        iframeBodyStyle.textContent =
            'html,body{margin:0;min-height:100%;}' +
            'body{padding-bottom:' + (hidden ? NAV_PAD_HIDDEN : NAV_PAD_SHOWN) + ' !important;}';
    }

    function setupIframeDoc() {
        try {
            var doc  = targetPage.contentDocument ||
                      (targetPage.contentWindow && targetPage.contentWindow.document);
            if (!doc || !doc.head) return;

            if (!iframeBodyStyle || !doc.head.contains(iframeBodyStyle)) {
                iframeBodyStyle = doc.createElement('style');
                doc.head.appendChild(iframeBodyStyle);
            }
            applyIframePadding(bottomBar && bottomBar.classList.contains('hidden'));
        } catch (e) {}
    }

    function onFrameLoad() {
        hideLoader();
        targetPage.classList.add('is-ready');
        setupIframeDoc();

        if (!firstLoadDone) {
            firstLoadDone = true;
            var elapsed  = Date.now() - startTime;
            var waitTime = Math.max(0, MIN_SPLASH_TIME - elapsed);

            setTimeout(function () {
                splash.style.opacity = '0';
                setTimeout(function () {
                    splash.classList.add('splash-hidden');
                    initBottomBar();
                }, 500);
            }, waitTime);
        }
    }
    targetPage.addEventListener('load', onFrameLoad);

    setTimeout(function () {
        if (firstLoadDone) return;
        splash.style.opacity = '0';
        showLoader(0);
        setTimeout(function () {
            splash.classList.add('splash-hidden');
            initBottomBar();
        }, 500);
    }, 3000);

    function initBottomBar() {
        if (bottomBarReady) return;
        bottomBarReady = true;

        if (!capsule || !sliderBg || tabItems.length === 0) return;

        var activeIndex = 0;

        function updateSliderPosition() {
            var activeItem = tabItems[activeIndex];
            if (!activeItem) return;

            var capsuleRect = capsule.getBoundingClientRect();
            var itemRect    = activeItem.getBoundingClientRect();
            
            // 核心修复：如果宽度太小（字体没加载出来），就退出，不计算不显示
            if (!itemRect.width || itemRect.width < 10) return;

            var pad = 3;
            sliderBg.style.left  = (itemRect.left - capsuleRect.left + pad) + 'px';
            sliderBg.style.width = (itemRect.width - pad * 2) + 'px';
            
            // 宽度正常计算完毕后，才给高光加上显示类
            sliderBg.classList.add('is-ready');
        }

        function setActiveTab(index, fromClick) {
            if (index === activeIndex && fromClick) {
                var cur = tabItems[activeIndex];
                if (cur) {
                    cur.style.transform = 'scale(.96)';
                    setTimeout(function () { if (cur) cur.style.transform = ''; }, 110);
                }
                return;
            }

            activeIndex = index;
            tabItems.forEach(function (item) { item.classList.remove('active'); });
            tabItems[activeIndex].classList.add('active');
            updateSliderPosition();

            if (fromClick) {
                var clicked = tabItems[activeIndex];
                if (clicked) {
                    clicked.style.background = 'rgba(255,255,255,.35)';
                    setTimeout(function () { if (clicked) clicked.style.background = ''; }, 130);
                }
            }
        }

        tabItems.forEach(function (item, idx) {
            item.addEventListener('click', function (e) {
                e.stopPropagation();
                setActiveTab(idx, true);
            });
        });

        if (searchCircle) {
            searchCircle.addEventListener('click', function () {
                var icon = searchCircle.querySelector('i');
                if (icon) {
                    icon.style.transform = 'scale(.88)';
                    setTimeout(function () { if (icon) icon.style.transform = ''; }, 130);
                }
                if (targetPage && targetPage.contentWindow) {
                    try {
                        targetPage.contentWindow.callPublishModal();
                    } catch (e) {
                        console.warn('调用内部发帖弹窗失败');
                    }
                }
            });
        }

        function hideNavBar() {
            if (bottomBar)  bottomBar.classList.add('hidden');
            if (restoreBtn) restoreBtn.classList.add('show');
            applyIframePadding(true);
        }
        function showNavBar() {
            if (bottomBar)  bottomBar.classList.remove('hidden');
            if (restoreBtn) restoreBtn.classList.remove('show');
            applyIframePadding(false);
            setTimeout(updateSliderPosition, 320);
        }

        if (hideBtn) {
            hideBtn.addEventListener('click', function (e) {
                e.stopPropagation();
                hideNavBar();
            });
        }
        if (restoreBtn) {
            restoreBtn.addEventListener('click', function (e) {
                e.stopPropagation();
                showNavBar();
            });
        }

        var resizeTimer;
        window.addEventListener('resize', function () {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(updateSliderPosition, 100);
        });

        if (typeof ResizeObserver !== 'undefined') {
            var ro = new ResizeObserver(function () { updateSliderPosition(); });
            ro.observe(capsule);
        }

        setActiveTab(0);

        requestAnimationFrame(function () {
            updateSliderPosition();
            setTimeout(updateSliderPosition, 60);
        });

        // 核心修复：监听字体加载完成，字体加载完重新校准位置
        if (document.fonts && document.fonts.ready) {
            document.fonts.ready.then(function () {
                updateSliderPosition();
            });
        }
    }

    document.addEventListener('DOMContentLoaded', function () {
        var publishBtn = document.getElementById('publishPostBtn');
        if (publishBtn) {
            publishBtn.onclick = function () {
                window.switchFramePage('core.php');
                var iframe = document.getElementById('target-page');
                if (iframe && iframe.contentWindow) {
                    setTimeout(function () {
                        try { iframe.contentWindow.location.hash = 'anchina1'; } catch (e) {}
                    }, 300);
                }
            };
        }
    });

})();
</script>

    try {
        var localVer = localStorage.getItem('site_version');
        if (localVer !== VERSION) {
            localStorage.setItem('site_version', VERSION);
            location.reload(true);
        }
    } catch (e) {}
})();
</script>
