<script>
(function () {
    var version = '1.0.0'; // 每次更新文件改这个数字就行

    function loadCSS(href) {
        var link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = href + '?v=' + version;
        document.head.appendChild(link);
    }

    function loadJS(src) {
        var script = document.createElement('script');
        script.src = src + '?v=' + version;
        script.defer = true;
        document.head.appendChild(script);
    }

    window.loadCSS = loadCSS;
    window.loadJS = loadJS;
})();
</script>

<script>
(function() {
    const splash = document.getElementById('splash-screen');
    const targetPage = document.getElementById('target-page');
    const minDisplayTime = 800;
    const startTime = Date.now();
    let bottomBarInitialized = false;

    function initBottomBarAndScroll() {
        if (bottomBarInitialized) return;
        bottomBarInitialized = true;

        const capsule = document.getElementById('capsuleContainer');
        const tabItems = document.querySelectorAll('.tab-item');
        const sliderBg = document.getElementById('sliderBg');
        const searchCircle = document.getElementById('searchCircle');
        const bottomBar = document.getElementById('bottomBar');

        if (!capsule || !sliderBg || tabItems.length === 0) return;

        let activeIndex = 0;
        function setActiveTab(index, fromClick = false) {
            if (index === activeIndex && fromClick) {
                const current = tabItems[activeIndex];
                if (current) {
                    current.style.transform = 'scale(0.97)';
                    setTimeout(() => { if (current) current.style.transform = ''; }, 100);
                }
                return;
            }
            activeIndex = index;
            tabItems.forEach(item => item.classList.remove('active'));
            tabItems[activeIndex].classList.add('active');
            updateSliderPosition();
            if (fromClick) {
                const clicked = tabItems[activeIndex];
                if (clicked) {
                    clicked.style.background = 'rgba(0, 0, 0, 0.05)';
                    setTimeout(() => { if (clicked) clicked.style.background = ''; }, 120);
                }
            }
        }

        function updateSliderPosition() {
            if (!capsule || !sliderBg || !tabItems[activeIndex]) return;
            const activeItem = tabItems[activeIndex];
            const capsuleRect = capsule.getBoundingClientRect();
            const itemRect = activeItem.getBoundingClientRect();
            let leftOffset = itemRect.left - capsuleRect.left;
            let itemWidth = itemRect.width;
            const pad = 3;
            sliderBg.style.left = (leftOffset + pad) + 'px';
            sliderBg.style.width = (itemWidth - pad * 2) + 'px';
        }

        tabItems.forEach((item, idx) => {
            item.addEventListener('click', (e) => {
                e.stopPropagation();
                setActiveTab(idx, true);
            });
        });

        // 加号按钮逻辑
        if (searchCircle) {
            searchCircle.addEventListener('click', () => {
                const icon = searchCircle.querySelector('i');
                if (icon) {
                    icon.style.transform = 'scale(0.9)';
                    setTimeout(() => { if (icon) icon.style.transform = ''; }, 120);
                }
                const iframe = document.getElementById('target-page');
                if (iframe && iframe.contentWindow) {
                    try {
                        iframe.contentWindow.callPublishModal();
                    } catch (e) {
                        console.warn('调用内部发帖弹窗失败');
                    }
                }
            });
        }

        let resizeTimer;
        window.addEventListener('resize', () => {
            if (resizeTimer) clearTimeout(resizeTimer);
            resizeTimer = setTimeout(updateSliderPosition, 100);
        });
        const resizeObserver = new ResizeObserver(updateSliderPosition);
        resizeObserver.observe(capsule);
        setActiveTab(0);

// iframe 底部栏 - 直接常驻显示（去除隐藏逻辑）
if (targetPage && bottomBar) {
    // 1. 强制底部栏显示（移除 hidden 类，确保它一直在那里）
    bottomBar.classList.remove('hidden');

    function attachIframeScroll() {
        try {
            const iframeDoc = targetPage.contentDocument || targetPage.contentWindow.document;
            if (!iframeDoc) return false;
            const iframeWin = targetPage.contentWindow;
            if (!iframeWin) return false;

            // 2. 依然保留 iframe 内部样式填充
            // 作用：因为底部栏是固定显示的，必须给 iframe 的 body 留出 85pt 的底边距，防止文章最底部被底部栏遮住
            const style = iframeDoc.createElement('style');
            style.textContent = `body { padding-bottom: 85pt !important; margin: 0; min-height: 100%; }`;
            iframeDoc.head.appendChild(style);

            // 3. 如果你原本还有 slider（滑动条）或进度条需要跟随页面滚动更新
            // 保留这个滚动监听，但只用来更新 UI，不再执行任何隐藏判断
            if (typeof updateSliderPosition === 'function') {
                iframeWin.addEventListener('scroll', () => {
                    updateSliderPosition();
                });
            }

            return true;
        } catch(e) {
            console.warn("iframe滚动监听受限");
            return false;
        }
    }

    if (targetPage.contentDocument && targetPage.contentDocument.readyState === 'complete') {
        attachIframeScroll();
    } else {
        targetPage.addEventListener('load', () => setTimeout(attachIframeScroll, 100));
    }
}
    }

    targetPage.onload = function() {
        const elapsed = Date.now() - startTime;
        const waitTime = Math.max(0, minDisplayTime - elapsed);
        setTimeout(() => {
            splash.style.opacity = '0';
            targetPage.style.opacity = '1';
            setTimeout(() => {
                splash.classList.add('splash-hidden');
                initBottomBarAndScroll();
            }, 500);
        }, waitTime);
    };

    setTimeout(() => {
        if (!splash.classList.contains('splash-hidden')) {
            splash.style.opacity = '0';
            targetPage.style.opacity = '1';
            setTimeout(() => {
                splash.classList.add('splash-hidden');
                initBottomBarAndScroll();
            }, 500);
        }
    }, 3000);
})();
</script>
