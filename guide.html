<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>APP新手引导</title>
<style>
:root{
  --bg:#FFFBD6;
  --text:#222222;
  --primary:#6366f1;
  --card-bg:rgba(255,255,255,0.45);
  --shadow:0 8px 32px rgba(0,0,0,0.12);
  /* 柔光变量 浅色 */
  --welcome-grad: radial-gradient(circle at 30% 30%, rgba(99,102,241,0.12), transparent 55%);
  --end-grad: radial-gradient(circle at 70% 70%, rgba(236,72,153,0.12), transparent 55%);
}
[data-theme="dark"]{
  --bg:#121212;
  --text:#f0f0f0;
  --primary:#6366f1;
  --card-bg:rgba(40,40,40,0.6);
  --shadow:0 8px 32px rgba(0,0,0,0.35);
  /* 柔光变量 深色，亮度提高一点 */
  --welcome-grad: radial-gradient(circle at 30% 30%, rgba(99,102,241,0.18), transparent 55%);
  --end-grad: radial-gradient(circle at 70% 70%, rgba(236,72,153,0.18), transparent 55%);
}
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:"Segoe UI",system-ui,sans-serif;
}
body{
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  transition: background 0.4s ease, color 0.4s ease;
  overflow:hidden;
}
/* 主题切换按钮 右上角 */
.theme-toggle{
  position:fixed;
  top:24px;
  right:24px;
  z-index:99;
  width:44px;
  height:44px;
  border-radius:999px;
  border:none;
  background:var(--card-bg);
  backdrop-filter:blur(10px);
  box-shadow:var(--shadow);
  cursor:pointer;
  font-size:20px;
  display:grid;
  place-items:center;
  transition:0.3s;
}
.theme-toggle:hover{
  transform:scale(1.08);
}
.wrap{
  width:100%;
  height:100vh;
  display:flex;
  flex-direction:column;
  padding: 60px 24px 40px;
}
/* 滑动容器，APP引导核心 */
.slide-wrap{
  flex:1;
  position:relative;
  width:100%;
}
.slide{
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:18px;
  opacity:0;
  transform:translateX(40px);
  transition: all 0.45s cubic-bezier(0.22,1,0.36,1);
  pointer-events:none;
}
.slide.active{
  opacity:1;
  transform:translateX(0);
  pointer-events:auto;
}
/* 欢迎页 & 结束页文字样式 */
.welcome h1, .ending h1{
  font-size:clamp(2rem,8vw,3rem);
  margin-bottom:16px;
  background:linear-gradient(90deg,#6366f1,#ec4899,#f59e0b);
  -webkit-background-clip:text;
  color:transparent;
  text-align:center;
  z-index:2;
}
.welcome p, .ending p{
  font-size:1.05rem;
  opacity:0.8;
  text-align:center;
  z-index:2;
}
/* 欢迎页底层柔光 */
.welcome::before{
  content:"";
  position:absolute;
  inset:0;
  background: var(--welcome-grad);
  z-index:1;
  pointer-events:none;
}
/* 结束页底层柔光 */
.ending::before{
  content:"";
  position:absolute;
  inset:0;
  background: var(--end-grad);
  z-index:1;
  pointer-events:none;
}
/* ✅ 图片自适应核心：适配横图/竖图/正方形，只限制可用空间，不固定宽高 */
.guide-img{
  max-width: 90%;
  max-height: calc(100% - 80px);
  width: auto;
  height: auto;
  object-fit: contain;
  user-select: none;
  -webkit-user-drag: none;
  pointer-events: none;
  border-radius: 18px;
  box-shadow: var(--shadow);
  z-index:2;
}
.desc{
  font-size:1.05rem;
  opacity:0.85;
  text-align:center;
  padding:0 16px;
  z-index:2;
}
/* 底部指示器 + 按钮区域 */
.bottom-area{
  width:100%;
  text-align:center;
}
.dots{
  display:flex;
  gap:10px;
  justify-content:center;
  margin-bottom:28px;
}
.dot{
  width:10px;
  height:10px;
  border-radius:99px;
  background:var(--text);
  opacity:0.22;
  transition:0.3s;
}
.dot.active{
  width:28px;
  opacity:0.9;
  background:#6366f1;
}
.btns{
  display:flex;
  gap:20px;
  justify-content:center;
  align-items:center;
}
/* 箭头按钮样式 */
.btn{
  width:52px;
  height:52px;
  border-radius:14px;
  border:1px solid rgba(99,102,241,0.24);
  font-size:22px;
  cursor:pointer;
  transition: 0.25s ease;
  backdrop-filter: blur(12px);
  display:grid;
  place-items:center;
}
#prevBtn{
  background: rgba(255,255,255,0.16);
  color: var(--text);
}
#nextBtn{
  background: var(--primary);
  color: #ffffff;
  border-color: var(--primary);
}
.btn:disabled{
  opacity:0.18;
  cursor:not-allowed;
  transform:none;
}
#prevBtn:hover:not(:disabled){
  background: rgba(255,255,255,0.28);
  transform: translateY(-2px);
}
#nextBtn:hover:not(:disabled){
  filter: brightness(1.08);
  transform: translateY(-2px);
}
.btn:active:not(:disabled){
  transform: translateY(0px);
}
/* 最后一页替换成开始使用方形按钮 */
.start-btn{
  padding:14px 36px;
  border-radius:14px;
  border:none;
  background: var(--primary);
  color:#fff;
  font-size:1rem;
  cursor:pointer;
  transition:0.25s ease;
}
.start-btn:hover{
  filter: brightness(1.08);
  transform: translateY(-2px);
}
.start-btn:active{
  transform: translateY(0);
}
</style>
</head>
<body>
<button class="theme-toggle" id="themeBtn">🌓</button>
<div class="wrap">
  <div class="slide-wrap" id="slideWrap">
    <!-- 第0页 欢迎页 -->
    <div class="slide active welcome" data-index="0">
      <h1>哈喽哈喽</h1>
      <p>接下来带你快速了解全部功能</p>
    </div>
    <!-- 预留5张图片位置 -->
    <div class="slide" data-index="1">
      <img class="guide-img" src="" alt="引导图1" data-src="guide-img2/main-light.jpg">
      <div class="desc">首页的浅色模式并非是白色，而是更护眼的米白哦</div>
    </div>
    <div class="slide" data-index="2">
      <img class="guide-img" src="" alt="引导图2" data-src="guide-img2/main-dark.jpg">
      <div class="desc">深色模式下的首页</div>
    </div>
    <div class="slide" data-index="3">
      <img class="guide-img" src="" alt="引导图3" data-src="guide-img2/profile-dark.jpg">
      <div class="desc">个人主页</div>
    </div>
    <div class="slide" data-index="4">
      <img class="guide-img" src="" alt="引导图4" data-src="guide-img2/profile-dark-function.jpg">
      <div class="desc">一些必要功能</div>
    </div>
    <div class="slide" data-index="5">
      <img class="guide-img" src="" alt="引导图5" data-src="guide-img2/comment-area-light.jpg">
      <div class="desc">评论区</div>
    </div>
    <!-- 第6页：结束语页面 -->
    <div class="slide ending" data-index="6">
      <h1>准备就绪</h1>
      <p>全部功能介绍完毕，现在开始体验吧！</p>
    </div>
  </div>
  <!-- 底部区域 -->
  <div class="bottom-area">
    <div class="dots" id="dotsWrap"></div>
    <div class="btns" id="btnGroup">
      <button class="btn" id="prevBtn">←</button>
      <button class="btn" id="nextBtn">→</button>
    </div>
  </div>
</div>

<script>
const slides = document.querySelectorAll('.slide');
const dotsWrap = document.getElementById('dotsWrap');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const btnGroup = document.getElementById('btnGroup');
const themeBtn = document.getElementById('themeBtn');
const slideWrap = document.getElementById('slideWrap');
const total = slides.length;
let current = 0;

// 触摸滑动变量
let touchStartX = 0;
let touchEndX = 0;
const minSwipeDistance = 50;

// 生成圆点指示器
for(let i=0;i<total;i++){
  const d = document.createElement('span');
  d.className = 'dot';
  if(i===0) d.classList.add('active');
  dotsWrap.appendChild(d);
}
const dots = document.querySelectorAll('.dot');

// 图片预加载
function preloadImages(nearIndex){
  const preloadRange = [nearIndex, nearIndex+1, nearIndex+2];
  preloadRange.forEach(idx=>{
    if(idx >= total) return;
    const img = slides[idx].querySelector('img');
    if(!img) return;
    const src = img.dataset.src;
    if(!src || img.src === src) return;
    img.src = src;
  })
}

function render(){
  slides.forEach(s=>s.classList.remove('active'));
  dots.forEach(d=>d.classList.remove('active'));
  slides[current].classList.add('active');
  dots[current].classList.add('active');

  // 最后一页：替换为【开始使用】按钮
  if(current === total -1){
    btnGroup.innerHTML = `<button class="start-btn" id="startBtn">开始使用</button>`;
    document.getElementById('startBtn').onclick = ()=>{
      location.href = "http://an.kijk.top";
    }
  }else{
    btnGroup.innerHTML = `
      <button class="btn" id="prevBtn">←</button>
      <button class="btn" id="nextBtn">→</button>
    `;
    const newPrev = document.getElementById('prevBtn');
    const newNext = document.getElementById('nextBtn');
    newPrev.disabled = current === 0;
    newPrev.onclick = ()=>{ if(current>0){ current--; render(); } }
    newNext.onclick = ()=>{ if(current < total-1){ current++; render(); } }
  }
  preloadImages(current);
}

// 触摸滑动监听
slideWrap.addEventListener('touchstart', (e)=>{
  touchStartX = e.changedTouches[0].screenX;
})
slideWrap.addEventListener('touchend', (e)=>{
  touchEndX = e.changedTouches[0].screenX;
  handleSwipe();
})
function handleSwipe(){
  const diff = touchEndX - touchStartX;
  if(Math.abs(diff) < minSwipeDistance) return;
  if(diff < 0){
    // 左滑 → 下一页
    if(current < total -1){
      current++;
      render();
    }
  }else{
    // 右滑 → 上一页
    if(current > 0){
      current--;
      render();
    }
  }
}

// 主题切换
const darkMedia = window.matchMedia('(prefers-color-scheme: dark)');
function setTheme(isDark){
  if(isDark){
    document.documentElement.setAttribute('data-theme','dark');
  }else{
    document.documentElement.removeAttribute('data-theme');
  }
}
setTheme(darkMedia.matches);
darkMedia.addEventListener('change',e=>{
  if(!userOverride) setTheme(e.matches);
})
let userOverride = false;
let userDark = false;
themeBtn.onclick = ()=>{
  userOverride = true;
  userDark = !userDark;
  setTheme(userDark);
}

render();
</script>
</body>
</html>
